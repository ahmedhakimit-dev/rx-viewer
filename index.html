<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Prescription Viewer | عارض الوصفات الطبية</title>
<style>
  :root {
    --ink: #0b3d91;
    --ink-light: #1e5bbf;
    --line: #dce3f2;
    --bg: #f5f7fb;
    --text: #1a2233;
    --muted: #5b6b85;
    --card-bg: #ffffff;
    --danger: #d93025;
    --danger-bg: #fdf2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 16px 12px;
  }
  .wrap {
    max-width: 760px;
    margin: 12px auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(11, 61, 145, 0.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, var(--ink), var(--ink-light));
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  header .sub {
    font-size: 13px;
    opacity: 0.9;
    margin-top: 4px;
  }
  .section {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .section h2 {
    margin-bottom: 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--ink);
    font-weight: 700;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
  }
  .kv {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
  }
  .kv-item {
    display: flex;
    flex-direction: column;
  }
  .kv-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .kv-value {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
  }
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    text-align: left;
  }
  th, td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    background: #f0f4fc;
    color: var(--ink);
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .badge {
    display: inline-block;
    background: #e7f0ff;
    color: var(--ink);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    margin-top: 2px;
  }
  .rx-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 8px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13px;
    background: #f8fafd;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px dashed var(--line);
  }
  .rx-meta-item {
    color: var(--muted);
  }
  .rx-meta-item strong {
    color: var(--ink);
  }
  .state-box {
    padding: 40px 24px;
    text-align: center;
  }
  .state-loading {
    color: var(--muted);
    font-size: 15px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(11, 61, 145, 0.15);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .state-error {
    background: var(--danger-bg);
    border: 1px solid #f5c6cb;
    border-radius: 8px;
    padding: 24px;
    margin: 20px;
    color: var(--danger);
  }
  .state-error h3 {
    font-size: 17px;
    margin-bottom: 8px;
  }
  .state-error p {
    font-size: 14px;
    line-height: 1.6;
  }
  .foot {
    padding: 16px 20px;
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    background: #fafbfe;
  }
  [dir="rtl"] {
    text-align: right;
  }
  [dir="auto"] {
    unicode-bidi: plaintext;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 19px; }
    .section { padding: 14px 16px; }
    th, td { padding: 8px 6px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <h1 id="headerTitle" dir="auto">Prescription | وصفة طبية</h1>
      <div class="sub" id="headerSub">Dr. Ahmed Hakim | Internal Medicine & Cardiology</div>
    </header>

    <div id="content">
      <div class="state-box state-loading">
        <div class="spinner"></div>
        <div>Loading prescription details…</div>
        <div style="font-size:12px; margin-top:4px;">جارٍ تحميل تفاصيل الوصفة الطبية…</div>
      </div>
    </div>

    <div class="foot">
      Official Medical Prescription View &bull; Secured with unique token lookup
    </div>
  </div>
</div>

<script>
// Configuration: Set your Supabase project credentials
// These can also be read dynamically or overridden by meta tags or query params
const SUPABASE_CONFIG = {
  url: window.RX_SUPABASE_URL || "https://xlwaliassfxfztewhpvs.supabase.co",
  anonKey: window.RX_SUPABASE_ANON_KEY || "sb_publishable_QpuKFQNt2Qn3Sqcfflq5hw_94j34x5h"
};

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function getTokenFromUrl() {
  const params = new URLSearchParams(window.location.search);
  let token = params.get('token');
  if (token) return token.trim();

  // Check hash params e.g. #token=...
  if (window.location.hash) {
    const hash = window.location.hash.replace(/^#/, '');
    const hashParams = new URLSearchParams(hash);
    token = hashParams.get('token');
    if (token) return token.trim();

    // Check direct path /p/<token>
    if (!hash.includes('=') && !hash.includes('&') && hash.length >= 32) {
      return hash.trim();
    }
  }

  // Check pathname /p/<token>
  const parts = window.location.pathname.split('/').filter(Boolean);
  const pIndex = parts.indexOf('p');
  if (pIndex !== -1 && parts[pIndex + 1]) {
    return parts[pIndex + 1].trim();
  }

  return null;
}

// Legacy fallback decoder for offline #base64url(zlib) payloads
async function decodeLegacyPayload(hash) {
  try {
    let s = hash.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);

    const ds = new DecompressionStream('deflate');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const text = await new Response(stream).text();
    return JSON.parse(text);
  } catch (e) {
    try {
      return JSON.parse(atob(hash.replace(/-/g, '+').replace(/_/g, '/')));
    } catch (e2) {
      return null;
    }
  }
}

async function fetchFromSupabase(token) {
  const rpcUrl = `${SUPABASE_CONFIG.url.replace(/\/+$/, '')}/rest/v1/rpc/get_prescription_by_token`;
  const res = await fetch(rpcUrl, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_CONFIG.anonKey,
      'Authorization': `Bearer ${SUPABASE_CONFIG.anonKey}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ p_token: token })
  });

  if (!res.ok) {
    throw new Error(`Server returned HTTP ${res.status}`);
  }

  const data = await res.json();
  return data;
}

function renderPrescription(p) {
  const doc = p.doctor || {};
  const pat = p.patient || {};
  const drugs = p.drugs || [];

  if (doc.name) {
    document.getElementById('headerTitle').textContent = doc.name;
  }
  let subTxt = [];
  if (doc.specialty) subTxt.push(doc.specialty);
  if (doc.license_no) subTxt.push(`Lic: ${doc.license_no}`);
  if (subTxt.length) {
    document.getElementById('headerSub').textContent = subTxt.join(' | ');
  }

  let html = '';

  // Doctor & Patient Sections
  html += `
  <div class="section">
    <div class="grid-2">
      <div>
        <h2>Prescriber | الطبيب المعالج</h2>
        <div class="kv">
          <div class="kv-item">
            <span class="kv-label">Doctor Name</span>
            <span class="kv-value" dir="auto"><b>${esc(doc.name || 'Dr. Ahmed Hakim')}</b></span>
          </div>
          ${doc.specialty ? `
          <div class="kv-item">
            <span class="kv-label">Specialty</span>
            <span class="kv-value" dir="auto">${esc(doc.specialty)}</span>
          </div>` : ''}
          ${doc.license_no ? `
          <div class="kv-item">
            <span class="kv-label">License No.</span>
            <span class="kv-value">${esc(doc.license_no)}</span>
          </div>` : ''}
        </div>
      </div>

      <div>
        <h2>Patient | المريض</h2>
        <div class="kv">
          <div class="kv-item">
            <span class="kv-label">Patient Name</span>
            <span class="kv-value" dir="auto"><b>${esc(pat.name || '—')}</b></span>
          </div>
          <div style="display:flex; gap:18px;">
            ${pat.age ? `
            <div class="kv-item">
              <span class="kv-label">Age</span>
              <span class="kv-value">${esc(pat.age)}</span>
            </div>` : ''}
            ${pat.sex ? `
            <div class="kv-item">
              <span class="kv-label">Sex</span>
              <span class="kv-value">${esc(pat.sex)}</span>
            </div>` : ''}
          </div>
        </div>
      </div>
    </div>

    <div class="rx-meta">
      ${p.date ? `<div class="rx-meta-item">Date: <strong>${esc(p.date)}</strong></div>` : ''}
      ${p.time ? `<div class="rx-meta-item">Time: <strong>${esc(p.time)}</strong></div>` : ''}
      ${p.rx_id ? `<div class="rx-meta-item">Rx No: <strong>${esc(p.rx_id)}</strong></div>` : ''}
    </div>
  </div>`;

  // Medications Table
  html += `
  <div class="section">
    <h2>Prescribed Medications | الأدوية المصروفة</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width:36px;">#</th>
            <th>Medication</th>
            <th>Dosage</th>
            <th>Frequency</th>
            <th>Duration</th>
            <th>Instructions / Notes</th>
          </tr>
        </thead>
        <tbody>`;

  if (drugs.length) {
    drugs.forEach((d, idx) => {
      const generic = esc(d.generic_name || '—');
      const brand = d.brand_name ? `<br/><span class="badge" dir="auto">${esc(d.brand_name)}</span>` : '';
      html += `
        <tr>
          <td>${idx + 1}</td>
          <td dir="auto"><b>${generic}</b>${brand}</td>
          <td dir="auto">${esc(d.dosage || '—')}</td>
          <td dir="auto">${esc(d.frequency || '—')}</td>
          <td dir="auto">${esc(d.duration || '—')}</td>
          <td dir="auto">${esc(d.notes || '—')}</td>
        </tr>`;
    });
  } else {
    html += `<tr><td colspan="6" style="text-align:center; padding:24px; color:#888;">No medications listed.</td></tr>`;
  }

  html += `
        </tbody>
      </table>
    </div>
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function showError(msgEn, msgAr) {
  document.getElementById('content').innerHTML = `
    <div class="state-error">
      <h3 dir="rtl" style="margin-bottom:8px;">${esc(msgAr || 'هذه الوصفة غير موجودة أو تم حذفها.')}</h3>
      <p style="font-size:15px; font-weight:600;">${esc(msgEn || 'This prescription was not found or has been deleted.')}</p>
      <p style="margin-top:10px; font-size:12.5px; opacity:0.85;">
        Please verify the QR code or contact the prescribing clinic for an updated copy.
      </p>
    </div>`;
}

async function init() {
  const token = getTokenFromUrl();

  if (token) {
    try {
      const data = await fetchFromSupabase(token);
      if (!data) {
        showError(
          'This prescription was not found or has been deleted.',
          'هذه الوصفة غير موجودة أو تم حذفها.'
        );
      } else {
        renderPrescription(data);
      }
      return;
    } catch (err) {
      console.warn('Supabase fetch failed, attempting local fallback...', err);
    }
  }

  // Fallback: Check if URL contains legacy base64 hash payload
  if (window.location.hash && window.location.hash.length > 20 && !window.location.hash.includes('token=')) {
    const legacyData = await decodeLegacyPayload(window.location.hash);
    if (legacyData) {
      renderPrescription(legacyData);
      return;
    }
  }

  // If no token or not found
  showError(
    'No valid prescription identifier found in this link.',
    'لم يتم العثور على معرّف صالح للوصفة في هذا الرابط.'
  );
}

window.addEventListener('DOMContentLoaded', init);
window.addEventListener('hashchange', init);
</script>
</body>
</html>
